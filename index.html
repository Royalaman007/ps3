<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISTRICT 360 | Khagaria Administration</title>
<style>
:root{--navy:#102746;--blue:#2563eb;--bg:#f3f6fb;--ink:#17263c;--muted:#718096;--line:#e5eaf2;--green:#15966a;--orange:#d97706;--red:#dc4c4c}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:white;font-weight:600}button:hover{filter:brightness(.95)}button.secondary{background:#eaf0f9;color:#233b5b}button.danger{background:#feecec;color:#b42318}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--navy);color:#dce7f5;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 25px}.logo{width:38px;height:38px;border-radius:12px;background:#3978e8;display:grid;place-items:center;font-weight:900;color:white;font-size:17px}.brand strong{font-size:17px;letter-spacing:.5px;color:white}.brand small{display:block;color:#9eb2cc;font-size:11px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#8da4c1;padding:14px 12px 7px}.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:#c6d4e7;padding:11px 12px;margin:2px 0;font-weight:500}.nav button.active,.nav button:hover{background:#203e65;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin:28px 8px 0;padding:13px;border:1px solid #345071;border-radius:12px;color:#a9bdd5;font-size:11px}.main{margin-left:245px;width:calc(100% - 245px)}header{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-weight:700;font-size:16px}.subcrumb{color:var(--muted);font-size:12px}.headright{display:flex;align-items:center;gap:13px}.search{width:230px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fafbfd}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e6efff;color:#2454a4;font-weight:700}.content{padding:27px 30px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.welcome h1{font-size:24px;margin:0 0 4px}.muted{color:var(--muted)}.eyebrow{color:var(--blue);font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,minmax(130px,1fr));margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #1c355008}.kpi-label{color:var(--muted);font-size:12px}.kpi-num{font-size:27px;font-weight:750;margin:7px 0 2px}.kpi-foot{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card h3{margin:0 0 15px;font-size:15px}.barrow{display:grid;grid-template-columns:125px 1fr 38px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.track{height:9px;background:#edf1f7;border-radius:10px;overflow:hidden}.fill{height:100%;background:#3978e8;border-radius:10px}.activity{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #f0f2f6}.dot{width:8px;height:8px;background:#4b86e8;border-radius:50%;margin-top:6px;flex:none}.activity small{display:block;color:var(--muted);margin-top:2px}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pagehead h1{font-size:23px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:white;min-width:150px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf0f5;font-size:12px}th{background:#f9fbfe;color:#68788e;font-size:10px;letter-spacing:.7px;text-transform:uppercase}tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#e9f7f1;color:#147a57}.status.Delayed,.status.Critical,.status.Rejected,.status.AtRisk{background:#fff0ef;color:#c43f39}.status.Pending,.status.UnderReview,.status.AtRisk{background:#fff6e8;color:#a86609}.status.Completed,.status.Resolved,.status.Approved{background:#e9f7f1;color:#147a57}.actions{display:flex;gap:5px}.actions button{padding:5px 8px;font-size:11px}.empty{text-align:center;padding:35px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0c1b30a6;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.modal{background:white;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formfield label{display:block;font-size:11px;color:#63748a;margin-bottom:5px;font-weight:650}.formfield input,.formfield select,.formfield textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.formfield.full{grid-column:1/-1}.formfield textarea{min-height:75px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#17395f;color:white;padding:12px 17px;border-radius:10px;box-shadow:0 8px 30px #0002;display:none;z-index:30}.progress{height:7px;background:#edf1f7;border-radius:9px;overflow:hidden;min-width:80px}.progress span{display:block;height:100%;background:#2785df}.publichero{background:linear-gradient(120deg,#112c50,#245a9c);color:white;border-radius:16px;padding:26px;margin-bottom:18px}.publichero h2{font-size:23px;margin:0 0 5px}.pill{padding:4px 8px;border-radius:20px;background:#eef3fb;color:#45617f;font-size:10px}.notice{background:#fff8e9;border:1px solid #f6e2b8;color:#875b15;padding:11px 14px;border-radius:9px;font-size:12px;margin-bottom:16px}.hamb{display:none;background:#eef3fb;color:#234}.mobileclose{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.search{width:180px}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.hamb{display:block}header{padding:0 14px}.content{padding:20px 14px}.headright .search{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.welcome{align-items:flex-start;gap:10px;flex-direction:column}.formgrid{grid-template-columns:1fr}.formfield.full{grid-column:auto}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">D</div><div><strong>DISTRICT 360</strong><small>ADMINISTRATION SUITE</small></div></div>
<div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
<button class="active" data-page="Overview"><span class="ico">▦</span>Overview</button>
<button data-page="Public Works"><span class="ico">🏗</span>Public Works</button>
<button data-page="Government Programmes"><span class="ico">◫</span>Government Programmes</button>
<button data-page="Files & Workflow"><span class="ico">▤</span>Files & Workflow</button>
<button data-page="District Assets"><span class="ico">▣</span>District Assets</button>
<button data-page="Alerts & Issues"><span class="ico">⚑</span>Alerts & Issues</button>
<button data-page="Reports & Analytics"><span class="ico">▥</span>Reports & Analytics</button>
<div class="navlabel">CITIZEN SERVICES</div><button data-page="Public Portal"><span class="ico">◎</span>Public Portal</button>
<div class="navlabel">CONFIGURATION</div><button data-page="Settings"><span class="ico">⚙</span>Settings</button></nav>
<div class="sidefoot">DEMO ENVIRONMENT<br><b>Khagaria District, Bihar</b><br>Sample data • Local browser storage</div></aside>
<main class="main"><header><div style="display:flex;align-items:center;gap:12px"><button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><div class="crumb" id="topTitle">Overview</div><div class="subcrumb">District Administration / Khagaria, Bihar</div></div></div><div class="headright"><input id="globalSearch" class="search" placeholder="⌕  Search current section..." oninput="renderPage()"><span title="Notifications">♧</span><div class="avatar">AA</div><div><b style="font-size:12px">Administrator</b><div class="muted" style="font-size:10px">Demo account</div></div></div></header>
<div class="content" id="content"></div></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="secondary" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="formgrid" id="formFields"></div><div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit">Save record</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const seed={
projects:[
{id:1,name:"Rural Road Improvement – Block A",department:"Rural Works",officer:"Executive Engineer",location:"Beldaur",budget:12500000,spent:7600000,progress:62,status:"On Track",start:"2026-04-01",due:"2027-01-31",published:true},
{id:2,name:"Community Health Centre Upgrade",department:"Health",officer:"Civil Surgeon",location:"Parbatta",budget:8400000,spent:6100000,progress:72,status:"Delayed",start:"2026-02-15",due:"2026-10-30",published:true},
{id:3,name:"School Infrastructure Renewal",department:"Education",officer:"District Education Officer",location:"Khagaria",budget:5600000,spent:1900000,progress:34,status:"At Risk",start:"2026-06-01",due:"2027-03-15",published:false},
{id:4,name:"Drainage & Flood Mitigation",department:"Urban Development",officer:"Municipal Executive Officer",location:"Khagaria",budget:18200000,spent:11200000,progress:81,status:"On Track",start:"2025-12-01",due:"2026-12-20",published:true}],
programmes:[
{id:1,name:"Rural Housing Support",department:"Rural Development",beneficiaries:1250,budget:32000000,spent:21800000,status:"Active",published:true},
{id:2,name:"Student Scholarship Assistance",department:"Education",beneficiaries:840,budget:6400000,spent:5100000,status:"Active",published:true},
{id:3,name:"Women Self-Help Group Support",department:"JEEViKA",beneficiaries:460,budget:9200000,spent:3700000,status:"Under Review",published:false}],
files:[
{id:1,ref:"DM/DEV/2026/041",subject:"Approval for rural road tender",department:"Rural Works",officer:"ADM (Development)",priority:"High",status:"Pending",date:"2026-11-16",remarks:"Awaiting administrative approval"},
{id:2,ref:"EDU/SCH/2026/118",subject:"School repair fund release",department:"Education",officer:"DEO",priority:"Medium",status:"Under Review",date:"2026-11-14",remarks:"Finance review in progress"},
{id:3,ref:"HEALTH/CHC/2026/022",subject:"CHC equipment procurement",department:"Health",officer:"Civil Surgeon",priority:"Critical",status:"Approved",date:"2026-11-10",remarks:"Approved for next stage"}],
assets:[
{id:1,name:"District Hospital Generator",category:"Equipment",location:"Khagaria Sadar",department:"Health",condition:"Good",maintenance:"Scheduled",inspection:"2026-10-20"},
{id:2,name:"Block Office Vehicle BR-34",category:"Vehicle",location:"Gogri",department:"General Administration",condition:"Needs Repair",maintenance:"Due",inspection:"2026-09-12"},
{id:3,name:"Flood Relief Boat Set",category:"Emergency",location:"Alauli",department:"Disaster Management",condition:"Good",maintenance:"Up to Date",inspection:"2026-10-30"}],
issues:[
{id:1,complaint:"Drain blockage near ward 8",citizen:"Sample Citizen",category:"Sanitation",location:"Khagaria",department:"Urban Development",priority:"High",status:"In Progress",date:"2026-11-18",remarks:"Assigned to field team"},
{id:2,complaint:"Streetlight not functioning",citizen:"Sample Citizen",category:"Electricity",location:"Gogri",department:"Energy",priority:"Medium",status:"Received",date:"2026-11-17",remarks:""},
{id:3,complaint:"Handpump repair request",citizen:"Sample Citizen",category:"Water Supply",location:"Beldaur",department:"PHED",priority:"Low",status:"Resolved",date:"2026-11-12",remarks:"Repair completed"}]
};
let db=load(), page="Overview", editId=null, currentType=null;
function load(){try{let x=JSON.parse(localStorage.getItem("d360data"));return x&&x.projects?x:structuredClone(seed)}catch(e){return JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem("d360data",JSON.stringify(db))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(!b)return;page=b.dataset.page;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("sidebar").classList.remove("open");renderPage()});
function kpi(label,num,foot){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-num">${num}</div><div class="kpi-foot">${foot}</div></div>`}
function status(s){let c=s.replaceAll(" ","").replaceAll("/","");return `<span class="status ${c}">${esc(s)}</span>`}
function overview(){let p=db.projects,files=db.files,issues=db.issues;let delayed=p.filter(x=>x.status==="Delayed"||x.status==="At Risk").length;return `<div class="welcome"><div><div class="eyebrow">DISTRICT PERFORMANCE AT A GLANCE</div><h1>Good day, Administrator</h1><div class="muted">Here is the latest administrative snapshot for Khagaria district.</div></div><button onclick="openForm('projects')">＋ Add Project</button></div><div class="grid kpis">${kpi("Development Projects",p.length,"Across district departments")}${kpi("On Track",p.filter(x=>x.status==="On Track").length,"Projects progressing as planned")}${kpi("Delayed / At Risk",delayed,"Require administrative attention")}${kpi("Active Programmes",db.programmes.filter(x=>x.status==="Active").length,"Government initiatives")}${kpi("Pending Files",files.filter(x=>x.status==="Pending"||x.status==="Under Review").length,"Awaiting action")}${kpi("Open Grievances",issues.filter(x=>x.status!=="Resolved"&&x.status!=="Closed").length,"Citizen issues to be addressed")}</div><div class="grid two"><div class="card"><h3>Development project progress</h3>${p.map(x=>`<div class="barrow"><span>${esc(x.name.slice(0,19))}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,x.progress))}%"></div></div><b>${x.progress}%</b></div>`).join("")}</div><div class="card"><h3>Administrative attention</h3>${files.filter(x=>x.status==="Pending"||x.status==="Under Review").map(x=>`<div class="activity"><div class="dot"></div><div><b>${esc(x.subject)}</b><div class="muted">${esc(x.ref)} · ${esc(x.officer)}</div><small>${status(x.priority)} &nbsp; ${esc(x.status)}</small></div></div>`).join("")||'<div class="empty">No pending files</div>'}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Department-wise project portfolio</h3>${[...new Set(p.map(x=>x.department))].map(d=>{let n=p.filter(x=>x.department===d).length;return `<div class="barrow"><span>${esc(d)}</span><div class="track"><div class="fill" style="width:${n/p.length*100}%"></div></div><b>${n}</b></div>`}).join("")}</div><div class="card"><h3>Recent activity</h3>${[...p.slice(-2).map(x=>({t:"Project updated",d:x.name})),...issues.slice(-2).map(x=>({t:"Grievance logged",d:x.complaint}))].reverse().map(x=>`<div class="activity"><div class="dot"></div><div><b>${esc(x.t)}</b><small>${esc(x.d)}</small></div></div>`).join("")}</div></div><div class="notice" style="margin-top:16px">Demonstration environment: all records shown are fictional sample data and are stored locally in this browser.</div>`}
const configs={
projects:{title:"Public Works",singular:"Project",fields:[["name","Project name","text",true],["department","Department","text",true],["officer","Responsible officer","text"],["location","Location / Block","text"],["budget","Estimated budget (₹)","number"],["spent","Expenditure (₹)","number"],["progress","Completion (%)","number"],["status","Status","select",["On Track","Delayed","At Risk","Completed"]],["start","Start date","date"],["due","Expected completion","date"],["published","Publish on public portal","checkbox"]],cols:[["name","Project"],["department","Department"],["location","Location"],["progress","Progress"],["status","Status"],["due","Due date"]]},
programmes:{title:"Government Programmes",singular:"Programme",fields:[["name","Programme name","text",true],["department","Department","text",true],["beneficiaries","Beneficiary count","number"],["budget","Allocated budget (₹)","number"],["spent","Expenditure (₹)","number"],["status","Implementation status","select",["Active","Under Review","Completed","On Hold"]],["published","Publish on public portal","checkbox"]],cols:[["name","Programme"],["department","Department"],["beneficiaries","Beneficiaries"],["budget","Budget"],["status","Status"]]},
files:{title:"Files & Workflow",singular:"File",fields:[["ref","File reference number","text",true],["subject","File subject","text",true],["department","Department","text"],["officer","Assigned officer","text"],["priority","Priority","select",["Low","Medium","High","Critical"]],["status","Workflow status","select",["Pending","Under Review","Approved","Rejected","Completed"]],["date","Submission date","date"],["remarks","Remarks","textarea"]],cols:[["ref","Reference"],["subject","Subject"],["department","Department"],["officer","Assigned to"],["priority","Priority"],["status","Status"]]},
assets:{title:"District Assets",singular:"Asset",fields:[["name","Asset name","text",true],["category","Category","select",["Building","Vehicle","Equipment","Emergency","Other"]],["location","Location","text"],["department","Responsible department","text"],["condition","Condition","select",["Good","Needs Repair","Poor","Unserviceable"]],["maintenance","Maintenance status","select",["Up to Date","Scheduled","Due","In Progress"]],["inspection","Last inspection date","date"]],cols:[["name","Asset"],["category","Category"],["location","Location"],["department","Department"],["condition","Condition"],["maintenance","Maintenance"]]},
issues:{title:"Alerts & Issues",singular:"Grievance",fields:[["complaint","Issue / complaint","text",true],["citizen","Complainant name","text"],["category","Category","select",["Sanitation","Roads","Water Supply","Electricity","Health","Other"]],["location","Location","text"],["department","Responsible department","text"],["priority","Priority","select",["Low","Medium","High","Critical"]],["status","Status","select",["Received","Assigned","In Progress","Resolved","Closed"]],["date","Received date","date"],["remarks","Resolution remarks","textarea"]],cols:[["id","Complaint ID"],["complaint","Issue"],["category","Category"],["location","Location"],["priority","Priority"],["status","Status"]]}
};
function tablePage(type){let c=configs[type],q=(document.getElementById("globalSearch").value||"").toLowerCase(),rows=db[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q));return `<div class="pagehead"><div><div class="eyebrow">DISTRICT OPERATIONS</div><h1>${c.title}</h1><div class="muted">Manage, monitor and update district records.</div></div><button onclick="openForm('${type}')">＋ Add ${c.singular}</button></div><div class="toolbar"><input class="field" placeholder="Search ${c.title.toLowerCase()}..." oninput="filterTable(this)" value="${esc(q)}"><select class="field" onchange="filterStatus(this)"><option value="">All statuses</option>${(type==="projects"?["On Track","Delayed","At Risk","Completed"]:type==="files"?["Pending","Under Review","Approved","Rejected","Completed"]:type==="issues"?["Received","Assigned","In Progress","Resolved","Closed"]:type==="programmes"?["Active","Under Review","Completed","On Hold"]:["Good","Needs Repair","Poor","Unserviceable"]).map(x=>`<option>${x}</option>`).join("")}</select><button class="secondary" onclick="exportCSV('${type}')">↓ Export CSV</button></div><div class="tablewrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join("")}<th>Actions</th></tr></thead><tbody id="tableBody">${rows.map(x=>rowHTML(type,x,c)).join("")}</tbody></table>${rows.length?"":'<div class="empty">No records found. Add a record to get started.</div>'}</div>`}
function rowHTML(type,x,c){return `<tr>${c.cols.map(([key])=>`<td>${key==="progress"?`<div style="display:flex;align-items:center;gap:8px"><div class="progress"><span style="width:${x[key]}%"></span></div>${x[key]}%</div>`:key==="budget"||key==="spent"?money(x[key]):key==="status"||key==="priority"||key==="condition"?status(x[key]):key==="id"&&type==="issues"?"GRV-"+String(x.id).padStart(5,"0"):esc(x[key]??"—")}</td>`).join("")}<td><div class="actions"><button class="secondary" onclick="viewRecord('${type}',${x.id})">View</button><button class="secondary" onclick="openForm('${type}',${x.id})">Edit</button><button class="danger" onclick="removeRecord('${type}',${x.id})">Delete</button></div></td></tr>`}
function filterTable(el){let q=el.value.toLowerCase(),type=Object.keys(configs).find(k=>configs[k].title===page);document.querySelectorAll("#tableBody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}
function filterStatus(el){document.querySelectorAll("#tableBody tr").forEach(tr=>tr.style.display=(!el.value||tr.innerText.includes(el.value))?"":"none")}
function renderPage(){document.getElementById("topTitle").textContent=page;let el=document.getElementById("content");if(page==="Overview")el.innerHTML=overview();else if(page==="Public Works")el.innerHTML=tablePage("projects");else if(page==="Government Programmes")el.innerHTML=tablePage("programmes");else if(page==="Files & Workflow")el.innerHTML=tablePage("files");else if(page==="District Assets")el.innerHTML=tablePage("assets");else if(page==="Alerts & Issues")el.innerHTML=tablePage("issues");else if(page==="Reports & Analytics")el.innerHTML=reports();else if(page==="Public Portal")el.innerHTML=portal();else el.innerHTML=settings()}
function openForm(type,id=null){currentType=type;editId=id;let c=configs[type],item=id?db[type].find(x=>x.id===id):{};document.getElementById("modalTitle").textContent=(id?"Edit ":"Add ")+c.singular;document.getElementById("formFields").innerHTML=c.fields.map(([key,label,t,req,opts])=>{let val=item[key]??(key==="progress"?0:key==="status"?(type==="projects"?"On Track":type==="files"?"Pending":type==="issues"?"Received":"Active"):"");if(t==="checkbox")return `<div class="formfield full"><label><input style="width:auto" type="checkbox" name="${key}" ${val?"checked":""}> ${label}</label></div>`;let input=t==="select"?`<select name="${key}">${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`:t==="textarea"?`<textarea name="${key}">${esc(val)}</textarea>`:`<input name="${key}" type="${t}" value="${esc(val)}" ${req?"required":""} ${t==="number"?(key==="progress"?'min="0" max="100"':'min="0"'):""}>`;return `<div class="formfield ${t==="textarea"?"full":""}"><label>${label}${req?" *":""}</label>${input}</div>`}).join("");document.getElementById("modalback").style.display="flex"}
function closeModal(){document.getElementById("modalback").style.display="none"}
document.getElementById("recordForm").addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target),obj={};configs[currentType].fields.forEach(([k,,t])=>{let v=t==="checkbox"?e.target.elements[k].checked:f.get(k);if(t==="number")v=Number(v||0);obj[k]=v});if(editId){Object.assign(db[currentType].find(x=>x.id===editId),obj)}else{obj.id=Math.max(0,...db[currentType].map(x=>x.id))+1;db[currentType].push(obj)}save();closeModal();renderPage();toast(editId?"Record updated":"Record added successfully")});
function removeRecord(type,id){if(!confirm("Delete this record? This action cannot be undone."))return;db[type]=db[type].filter(x=>x.id!==id);save();renderPage();toast("Record deleted")}
function viewRecord(type,id){let x=db[type].find(x=>x.id===id);alert(Object.entries(x).map(([k,v])=>k+": "+v).join("\\n"))}
function exportCSV(type){let rows=db[type],keys=Object.keys(rows[0]||{});let csv=[keys.join(","),...rows.map(r=>keys.map(k=>'"'+String(r[k]??"").replaceAll('"','""')+'"').join(","))].join("\\n");download(csv,type+"_report.csv","text/csv");toast("CSV report exported")}
function download(data,name,mime){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function reports(){let total=db.projects.reduce((s,x)=>s+Number(x.budget||0),0),spent=db.projects.reduce((s,x)=>s+Number(x.spent||0),0);return `<div class="pagehead"><div><div class="eyebrow">PERFORMANCE INTELLIGENCE</div><h1>Reports & Analytics</h1><div class="muted">District-level performance summaries and exports.</div></div><button onclick="window.print()">Print report</button></div><div class="grid three">${kpi("Project budget",money(total),"Total estimated allocation")}${kpi("Recorded expenditure",money(spent),"Across listed projects")}${kpi("Budget utilisation",total?Math.round(spent/total*100)+"%":"0%","Based on sample records")}</div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Project status summary</h3>${["On Track","Delayed","At Risk","Completed"].map(s=>`<div class="barrow"><span>${s}</span><div class="track"><div class="fill" style="width:${db.projects.length?db.projects.filter(x=>x.status===s).length/db.projects.length*100:0}%"></div></div><b>${db.projects.filter(x=>x.status===s).length}</b></div>`).join("")}<button class="secondary" onclick="exportCSV('projects')">Export project report</button></div><div class="card"><h3>Administrative reports</h3>${Object.entries({Programmes:"programmes",Files:"files",Assets:"assets",Grievances:"issues"}).map(([n,k])=>`<div class="activity" style="justify-content:space-between"><b>${n} report</b><button class="secondary" onclick="exportCSV('${k}')">Export CSV</button></div>`).join("")}</div></div>`}
function portal(){let p=db.projects.filter(x=>x.published),g=db.programmes.filter(x=>x.published);return `<div class="publichero"><div class="eyebrow" style="color:#b9d4ff">CITIZEN INFORMATION PORTAL</div><h2>Khagaria District — Public Updates</h2><div style="color:#d7e7ff">Access public development updates and government programme information.</div></div><div class="notice">Only records marked for publication by the administrator appear here. Information is illustrative sample data.</div><div class="grid two"><div class="card"><h3>Public Development Projects</h3>${p.map(x=>`<div class="activity"><div style="flex:1"><b>${esc(x.name)}</b><small>${esc(x.location)} · ${esc(x.department)}</small><div class="progress" style="margin-top:8px"><span style="width:${x.progress}%"></span></div><small>${x.progress}% complete · ${esc(x.status)}</small></div></div>`).join("")||'<div class="empty">No public projects available.</div>'}</div><div class="card"><h3>Government Programmes</h3>${g.map(x=>`<div class="activity"><div><b>${esc(x.name)}</b><small>${esc(x.department)} · ${x.beneficiaries} beneficiaries</small></div></div>`).join("")||'<div class="empty">No public programmes available.</div>'}</div></div><div class="card" style="margin-top:16px"><h3>Submit a public grievance (demo)</h3><div class="formgrid"><div class="formfield"><label>Your name</label><input id="citizenName" placeholder="Enter your name"></div><div class="formfield"><label>Issue category</label><select id="citizenCat"><option>Roads</option><option>Sanitation</option><option>Water Supply</option><option>Electricity</option><option>Other</option></select></div><div class="formfield full"><label>Describe your issue</label><textarea id="citizenIssue" placeholder="Explain the issue and location"></textarea></div></div><button style="margin-top:12px" onclick="submitGrievance()">Submit grievance</button></div>`}
function submitGrievance(){let complaint=document.getElementById("citizenIssue").value.trim();if(!complaint){toast("Please describe your issue");return}db.issues.push({id:Math.max(0,...db.issues.map(x=>x.id))+1,complaint,citizen:document.getElementById("citizenName").value||"Public user",category:document.getElementById("citizenCat").value,location:"To be verified",department:"Unassigned",priority:"Medium",status:"Received",date:new Date().toISOString().slice(0,10),remarks:"Submitted through public portal"});save();renderPage();toast("Grievance submitted in demo environment")}
function settings(){return `<div class="pagehead"><div><div class="eyebrow">CONFIGURATION</div><h1>Settings</h1><div class="muted">Manage local demonstration data and application preferences.</div></div></div><div class="grid two"><div class="card"><h3>District information</h3><p><b>District:</b> Khagaria</p><p><b>State:</b> Bihar</p><p><b>Application:</b> DISTRICT 360</p><p><b>Environment:</b> Standalone local demo</p><p><b>Storage:</b> Browser localStorage</p></div><div class="card"><h3>Data management</h3><p class="muted">Download a backup of all current records or restore the original sample dataset.</p><button onclick="download(JSON.stringify(db,null,2),'district360_backup.json','application/json')">↓ Export all data (JSON)</button> <button class="danger" onclick="resetData()">Reset demo data</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><label class="muted">Demonstration role</label><select class="field" style="display:block;margin-top:7px" onchange="toast('Role changed for visual demonstration only')"><option>District Administrator</option><option>Department Officer</option><option>Block Officer</option><option>Data Entry Operator</option></select><small class="muted">Role selection does not provide real access control.</small></div></div><div class="notice" style="margin-top:16px">This standalone application is a frontend prototype. It does not connect to official government systems, authenticate users, or transmit data to a server.</div>`}
function resetData(){if(!confirm("Restore original sample data? Your local changes will be lost."))return;db=JSON.parse(JSON.stringify(seed));save();renderPage();toast("Sample data restored")}
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter")renderPage()});
renderPage();
</script></body></html>
